<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#2b1b52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гралик">
<title>Гралик — ігри для малят</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#2b1b52; --bg2:#3a2470; --card:#ffffff14; --line:#ffffff2e;
  --txt:#ffffff; --dim:#ffffffb0;
  --red:#ff5a5f; --org:#ff9f43; --yel:#ffd93d; --grn:#4ecb71; --blu:#4aa8ff; --vio:#b06bff; --pnk:#ff7ac6;
  --ok:#4ecb71; --no:#ff5a5f;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:radial-gradient(120% 90% at 50% 0%,#4b2d8f 0%,var(--bg) 60%,#1d1238 100%);
  color:var(--txt); font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:800; user-select:none; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:60px}
.top h1{font-size:19px;margin:0;flex:1;text-align:center;letter-spacing:.3px}
.icon{
  width:50px;height:50px;flex:0 0 auto;border-radius:16px;background:var(--card);
  border:2px solid var(--line);font-size:24px;display:grid;place-items:center;
}
.icon:active{transform:scale(.93)}
.stars{
  display:flex;align-items:center;gap:5px;background:#ffd93d22;border:2px solid #ffd93d66;
  border-radius:16px;padding:8px 13px;font-size:17px;color:var(--yel)
}

/* ---------- екрани ---------- */
.scr{flex:1;display:none;flex-direction:column;min-height:0;padding:0 12px 14px}
.scr.on{display:flex}

/* ---------- меню ---------- */
.menu{
  flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
  grid-auto-rows:minmax(118px,1fr);gap:12px;overflow:auto;padding-bottom:6px
}
.tile{
  border-radius:var(--r);padding:18px 10px 14px;display:flex;flex-direction:column;
  align-items:center;gap:7px;color:#1b1038;box-shadow:0 7px 0 #0003;min-height:132px;justify-content:center;
}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 #0003}
.tile .em{font-size:46px;line-height:1;filter:drop-shadow(0 3px 2px #0002)}
.tile .nm{font-size:16px;text-align:center;line-height:1.15;font-weight:900}
.t1{background:linear-gradient(170deg,#ffe066,#ffb703)}
.t2{background:linear-gradient(170deg,#7ee8a2,#38b676)}
.t3{background:linear-gradient(170deg,#8ec5ff,#4a90ff)}
.t4{background:linear-gradient(170deg,#ffafd0,#ff6fae)}
.t5{background:linear-gradient(170deg,#d0b3ff,#9a6bff)}
.t6{background:linear-gradient(170deg,#ffc09f,#ff7a45)}
.menu-note{color:var(--dim);font-size:12.5px;text-align:center;margin:10px 2px 0;font-weight:700;line-height:1.5}

/* ---------- спільне для ігор ---------- */
.ask{
  text-align:center;font-size:21px;margin:4px 0 12px;line-height:1.25;min-height:28px;
}
.ask small{display:block;font-size:14px;color:var(--dim);font-weight:700;margin-top:3px}
.play{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{
  border-radius:var(--r);background:var(--card);border:3px solid var(--line);
  display:grid;place-items:center;font-size:40px;box-shadow:0 6px 0 #0003;
}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #0003}
.big.ok{background:#4ecb7133;border-color:var(--ok);animation:pop .4s}
.big.no{background:#ff5a5f2e;border-color:var(--no);animation:shake .4s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- мелодія ---------- */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:340px;margin:0 auto;width:100%}
.pad{aspect-ratio:1;border-radius:26px;box-shadow:0 8px 0 #0004;opacity:.55;transition:opacity .12s,transform .12s}
.pad.lit{opacity:1;transform:scale(1.05)}
.p1{background:var(--red)} .p2{background:var(--grn)} .p3{background:var(--blu)} .p4{background:var(--yel)}

/* ---------- меморі ---------- */
.cards{display:grid;gap:10px;margin:0 auto;width:100%;max-width:420px}
.card{
  aspect-ratio:1;border-radius:18px;background:linear-gradient(165deg,#7b5cff,#5433d6);
  display:grid;place-items:center;font-size:34px;box-shadow:0 6px 0 #0004;
}
.card .face{opacity:0;transition:opacity .12s}
.card.open{background:#fff}
.card.open .face{opacity:1}
.card.done{background:#4ecb7140;border:3px solid var(--ok)}
.card.done .face{opacity:1}

/* ---------- лічба ---------- */
.things{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:16px 12px;min-height:140px;
}
.things span{font-size:36px;animation:in .3s backwards}
@keyframes in{from{transform:scale(0);opacity:0}}
.nums{display:flex;gap:12px;justify-content:center}
.num{width:84px;height:84px;font-size:38px}

/* ---------- букви ---------- */
.pic{font-size:92px;text-align:center;line-height:1}
.word{text-align:center;font-size:30px;letter-spacing:5px;margin-top:4px}
.letters{display:flex;gap:12px;justify-content:center}
.let{width:84px;height:84px;font-size:40px}

/* ---------- тварини ---------- */
.animals{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.anim{width:100px;height:100px;font-size:52px}
.speaker{
  margin:0 auto;width:120px;height:120px;border-radius:50%;background:linear-gradient(165deg,#ffd93d,#ff9f43);
  display:grid;place-items:center;font-size:56px;box-shadow:0 8px 0 #0004;color:#3a2470;
}
.speaker:active{transform:translateY(4px);box-shadow:0 4px 0 #0004}
.speaker.ring{animation:ring .9s ease-out}
@keyframes ring{
  0%{box-shadow:0 8px 0 #0004,0 0 0 0 #ffd93d99}
  70%{box-shadow:0 8px 0 #0004,0 0 0 30px #ffd93d00}
  100%{box-shadow:0 8px 0 #0004,0 0 0 0 #ffd93d00}
}

/* ---------- змійка ---------- */
.snake-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
#snakeC{
  background:#1d1238;border:4px solid var(--line);border-radius:18px;touch-action:none;
  width:min(92vw,360px);height:min(92vw,360px);
}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:9px}
.dpad button{border-radius:18px;background:var(--card);border:3px solid var(--line);font-size:28px}
.dpad button:active{background:#ffffff2e}
.d-up{grid-area:1/2} .d-left{grid-area:2/1} .d-down{grid-area:2/2} .d-right{grid-area:2/3}
.score{font-size:19px;text-align:center}

/* ---------- наліпки ---------- */
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow:auto;align-content:start}
.sticker{
  aspect-ratio:1;border-radius:18px;background:var(--card);border:2px dashed var(--line);
  display:grid;place-items:center;font-size:34px;
}
.sticker.got{background:#ffd93d26;border:3px solid #ffd93d99;border-style:solid;animation:pop .5s}
.sticker .q{opacity:.25;font-size:26px}

/* ---------- діалог ---------- */
.ov{position:fixed;inset:0;background:#0b0620d9;display:grid;place-items:center;padding:20px;z-index:50}
.ov.hid{display:none}
.box{
  background:linear-gradient(170deg,#4b2d8f,#33205f);border:3px solid var(--line);
  border-radius:26px;padding:22px 18px;max-width:380px;width:100%;text-align:center
}
.box .em{font-size:60px;line-height:1}
.box h2{font-size:22px;margin:10px 0 6px}
.box p{color:var(--dim);font-size:14px;font-weight:700;margin:0 0 14px;line-height:1.5}
.btn{
  border-radius:18px;padding:14px 20px;font-size:17px;background:var(--card);
  border:3px solid var(--line);box-shadow:0 5px 0 #0003;margin:5px
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.btn.go{background:linear-gradient(170deg,#ffe066,#ffb703);color:#2b1b52;border-color:#0000}
.inp{
  width:120px;text-align:center;font-size:30px;padding:10px;border-radius:16px;
  background:#0003;border:3px solid var(--line);color:#fff;font-weight:900
}

/* ---------- салют ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.cfi{position:absolute;font-size:26px;animation:fall 1.5s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:#1d1238ee;border:3px solid var(--line);border-radius:18px;padding:12px 18px;font-size:16px;
  transition:opacity .25s
}
.toast.hid{opacity:0;pointer-events:none}
</style>
</head>
<body>

<header class="top">
  <button class="icon" id="back" aria-label="Назад">⬅️</button>
  <h1 id="title">Гралик</h1>
  <button class="stars" id="starBtn"><span>⭐</span><span id="starN">0</span></button>
</header>

<!-- меню -->
<section class="scr on" id="s-menu">
  <div class="menu">
    <button class="tile t1" data-go="melody"><span class="em">🎵</span><span class="nm">Повтори<br>мелодію</span></button>
    <button class="tile t2" data-go="memory"><span class="em">🃏</span><span class="nm">Знайди<br>пару</span></button>
    <button class="tile t3" data-go="count"><span class="em">🔢</span><span class="nm">Скільки?</span></button>
    <button class="tile t4" data-go="letter"><span class="em">🔤</span><span class="nm">Перша<br>буква</span></button>
    <button class="tile t5" data-go="animal"><span class="em">🐮</span><span class="nm">Хто як<br>говорить</span></button>
    <button class="tile t6" data-go="snake"><span class="em">🐍</span><span class="nm">Змійка</span></button>
  </div>
  <p class="menu-note">Обирай гру й грай. Зірочки збираються в альбом наліпок ⭐</p>
</section>

<!-- мелодія -->
<section class="scr" id="s-melody">
  <div class="ask" id="melAsk">Слухай…</div>
  <div class="play">
    <div class="pads" id="pads">
      <button class="pad p1" data-p="0"></button>
      <button class="pad p2" data-p="1"></button>
      <button class="pad p3" data-p="2"></button>
      <button class="pad p4" data-p="3"></button>
    </div>
    <div class="row"><button class="btn go" id="melGo">▶️ Слухати ще</button></div>
  </div>
</section>

<!-- меморі -->
<section class="scr" id="s-memory">
  <div class="ask" id="memAsk">Знайди однакові<small>натискай картки</small></div>
  <div class="play"><div class="cards" id="cards"></div></div>
</section>

<!-- лічба -->
<section class="scr" id="s-count">
  <div class="ask" id="cntAsk">Скільки?</div>
  <div class="play">
    <div class="things" id="things"></div>
    <div class="nums" id="nums"></div>
  </div>
</section>

<!-- букви -->
<section class="scr" id="s-letter">
  <div class="ask" id="letAsk">З якої букви починається?</div>
  <div class="play">
    <div>
      <div class="pic" id="letPic">🐈</div>
      <div class="word" id="letWord">КІТ</div>
    </div>
    <div class="letters" id="letters"></div>
  </div>
</section>

<!-- тварини -->
<section class="scr" id="s-animal">
  <div class="ask" id="aniAsk">Хто так говорить?<small>натисни динамік, щоб почути ще</small></div>
  <div class="play">
    <button class="speaker" id="aniPlay">🔊</button>
    <div class="animals" id="animals"></div>
  </div>
</section>

<!-- змійка -->
<section class="scr" id="s-snake">
  <div class="ask"><span id="snAsk">Збирай яблучка 🍎</span></div>
  <div class="play">
    <div class="snake-wrap">
      <canvas id="snakeC" width="360" height="360"></canvas>
      <div class="score" id="snScore">0</div>
      <div class="dpad">
        <button class="d-up" data-d="u">⬆️</button>
        <button class="d-left" data-d="l">⬅️</button>
        <button class="d-down" data-d="d">⬇️</button>
        <button class="d-right" data-d="r">➡️</button>
      </div>
    </div>
  </div>
</section>

<!-- наліпки -->
<section class="scr" id="s-album">
  <div class="ask" id="albAsk">Мої наліпки</div>
  <div class="album" id="album"></div>
</section>

<div class="ov hid" id="ov"><div class="box" id="ovBox"></div></div>
<div id="fx"></div>
<div class="toast hid" id="toast"></div>

<script>
'use strict';
const APP_VERSION = '1.0.2';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rnd(a.length)];
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- памʼять пристрою ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('gralyk.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gralyk.' + k, JSON.stringify(v)); } catch (e) { /* памʼять заповнена */ } },
};
const S = {
  stars: LS.get('stars', 0),
  got: LS.get('got', []),        // здобуті наліпки
  best: LS.get('best', 0),       // рекорд у змійці
  sound: LS.get('sound', true),
  voice: LS.get('voice', true),
};

/* ---------- звук ---------- */
let AC = null;
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') { const p = AC.resume(); if (p && p.catch) p.catch(() => {}); }
  return AC;
}
/** Короткий чистий тон. Усі звуки синтезуються, файлів немає. */
function beep(freq, dur = 0.18, type = 'sine', vol = 0.22) {
  if (!S.sound) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(vol, a.currentTime + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
const cheer = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.2), i * 90)); };
const oops = () => { beep(300, 0.16, 'sine', 0.16); setTimeout(() => beep(220, 0.22, 'sine', 0.16), 130); };
const blip = () => beep(880, 0.08, 'square', 0.12);

/* ---------- маленький синтезатор голосів тварин ----------
   Синтезатор мови читає «мууу» як набір букв, тому звуки тварин
   збираємо самі: тон з огинаючою висоти + фільтр + вібрато. */
let NOISE = null, NOISE_CTX = null;
function noiseBuf(a) {
  if (NOISE && NOISE_CTX === a) return NOISE;
  const n = Math.floor(a.sampleRate * 1.2);
  const b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  NOISE = b; NOISE_CTX = a; return b;
}
/** pts = [[частка часу 0..1, значення], …] */
function ramp(param, pts, t, dur) {
  param.setValueAtTime(Math.max(20, pts[0][1]), t);
  for (let i = 1; i < pts.length; i++)
    param.exponentialRampToValueAtTime(Math.max(20, pts[i][1]), t + dur * pts[i][0]);
}
function envOsc({ type = 'sawtooth', pts, dur, vol = 0.2, t0 = 0, filt, fpts, q = 1, vib }) {
  if (!S.sound) return;
  const a = ac(); if (!a) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator(); o.type = type;
  ramp(o.frequency, pts, t, dur);
  let node = o;
  if (fpts) {
    const f = a.createBiquadFilter();
    f.type = filt || 'lowpass'; f.Q.value = q;
    ramp(f.frequency, fpts, t, dur);
    o.connect(f); node = f;
  }
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.05, dur * 0.2));
  g.gain.setValueAtTime(vol, t + dur * 0.65);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  node.connect(g); g.connect(a.destination);
  if (vib) {   // тремтіння голосу
    const l = a.createOscillator(), lg = a.createGain();
    l.frequency.value = vib[0]; lg.gain.value = vib[1];
    l.connect(lg); lg.connect(o.frequency);
    l.start(t); l.stop(t + dur + 0.05);
  }
  o.start(t); o.stop(t + dur + 0.05);
}
function envNoise({ dur, vol = 0.1, t0 = 0, fpts = [[0, 1500], [1, 700]], filt = 'bandpass', q = 1 }) {
  if (!S.sound) return;
  const a = ac(); if (!a) return;
  const t = a.currentTime + t0;
  const src = a.createBufferSource(); src.buffer = noiseBuf(a);
  const f = a.createBiquadFilter(); f.type = filt; f.Q.value = q;
  ramp(f.frequency, fpts, t, dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.03, dur * 0.25));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t); src.stop(t + dur + 0.02);
}

/* ---------- голос ----------
   Говоримо ТІЛЬКИ справжнім українським голосом. Якщо його в телефоні немає,
   краще промовчати: чужий голос читає кирилицю своїми правилами і виходить
   «іноземець». Усі завдання продубльовані текстом на екрані. */
let VOICES = [], UA_VOICE = null, VOICE_READY = false;
const isUA = (v) => /^uk\b|^uk[-_]/i.test(v && v.lang || '');
function loadVoices() {
  try { VOICES = speechSynthesis.getVoices() || []; } catch (e) { VOICES = []; }
  const uk = VOICES.filter(isUA);
  UA_VOICE = uk.find((v) => v.localService) || uk[0] || null;   // офлайн-голос кращий
  VOICE_READY = VOICES.length > 0;
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 1200);   // Android подає список із затримкою
}
function voiceInfo() {
  if (!('speechSynthesis' in window)) return 'пристрій не вміє озвучувати';
  if (UA_VOICE) return `українська (${UA_VOICE.name})`;
  if (!VOICE_READY) return 'перевіряється…';
  return 'українського голосу немає — озвучка мовчить';
}
function say(text, rate = 0.88) {
  if (!S.voice || !('speechSynthesis' in window)) return;
  if (!VOICE_READY) loadVoices();            // може, список уже під'їхав
  if (VOICE_READY && !UA_VOICE) return;      // чужим голосом не читаємо
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (UA_VOICE) u.voice = UA_VOICE;
    u.lang = 'uk-UA';
    u.rate = rate; u.pitch = 1.12;
    speechSynthesis.speak(u);
  } catch (e) { /* не вийшло — гра працює далі */ }
}

/* ---------- дрібниці ---------- */
function vibe(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* */ } }
let toastT = null;
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.remove('hid');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.add('hid'), 1800);
}

const SN = { n: 12, cell: 30, body: [], dir: [1, 0], next: [1, 0], food: null, timer: null, score: 0, over: false };
const SN_FOOD = ['🍎', '🍓', '🍌', '🍇', '🥕', '🍒'];
const EMOJI_FONT = '"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji","Twemoji Mozilla",serif';
let snFoodEm = '🍎';
function snDraw() {
  const c = $('#snakeC'), g = c.getContext('2d'), s = SN.cell;
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = '#ffffff10';
  for (let i = 0; i < SN.n; i++) for (let j = 0; j < SN.n; j++) if ((i + j) % 2) g.fillRect(i * s, j * s, s, s);
  if (SN.food) {
    const fx = SN.food[0] * s + s / 2, fy = SN.food[1] * s + s / 2;
    // світлий кружечок під яблучком — видно навіть там, де емодзі чорно-білі
    g.fillStyle = '#ffd93d55';
    g.beginPath(); g.arc(fx, fy, s * 0.44, 0, 7); g.fill();
    g.font = `${Math.round(s * 0.74)}px ${EMOJI_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#fff';
    g.fillText(snFoodEm, fx, fy + s * 0.03);
  }
  SN.body.forEach((p, i) => {
    g.fillStyle = i === 0 ? '#ffd93d' : `hsl(${140 - i * 3},65%,${58 - Math.min(20, i)}%)`;
    const pad = s * (i === 0 ? 0.03 : 0.1);
    if (g.roundRect) {
      g.beginPath();
      g.roundRect(p[0] * s + pad, p[1] * s + pad, s - pad * 2, s - pad * 2, s * 0.23);
      g.fill();
    } else {   // старий браузер без roundRect
      g.fillRect(p[0] * s + pad, p[1] * s + pad, s - pad * 2, s - pad * 2);
    }
    if (i === 0) {   // очі дивляться туди, куди повзе
      g.fillStyle = '#2b1b52';
      const ex = p[0] * s + s / 2 + SN.dir[0] * s * 0.17, ey = p[1] * s + s / 2 + SN.dir[1] * s * 0.17;
      const ox = s * 0.1 * (1 - Math.abs(SN.dir[0])), oy = s * 0.1 * (1 - Math.abs(SN.dir[1]));
      g.beginPath(); g.arc(ex - ox, ey - oy, s * 0.075, 0, 7); g.fill();
      g.beginPath(); g.arc(ex + ox, ey + oy, s * 0.075, 0, 7); g.fill();
    }
  });
}
function snFoodNew() {
  const free = [];
  for (let x = 0; x < SN.n; x++) for (let y = 0; y < SN.n; y++)
    if (!SN.body.some((p) => p[0] === x && p[1] === y)) free.push([x, y]);
  SN.food = free.length ? pick(free) : null;
  snFoodEm = pick(SN_FOOD);
}
function snStep() {
  if (SN.over) return;
  SN.dir = SN.next;
  const h = SN.body[0];
  // без стін: доповзає до краю і зʼявляється з протилежного
  const nx = (h[0] + SN.dir[0] + SN.n) % SN.n, ny = (h[1] + SN.dir[1] + SN.n) % SN.n;
  if (SN.body.some((p, i) => i < SN.body.length - 1 && p[0] === nx && p[1] === ny)) { snOver(); return; }
  SN.body.unshift([nx, ny]);
  if (SN.food && nx === SN.food[0] && ny === SN.food[1]) {
    SN.score++; $('#snScore').textContent = SN.score;
    beep(700 + SN.score * 20, 0.12, 'triangle', 0.2); vibe(25);
    if (SN.score % 5 === 0) { addStar(); confetti(); }
    snFoodNew();
  } else SN.body.pop();
  snDraw();
}
function snOver() {
  SN.over = true; clearInterval(SN.timer); oops(); vibe(150);
  if (SN.score > S.best) { S.best = SN.score; LS.set('best', S.best); }
  dialog({
    em: '🐍', h: `Зібрано: ${SN.score}`,
    p: S.best ? `Найкраще: ${S.best}` : '',
    btn: '🔁 Ще раз', btn2: '🏠 Меню',
    onBtn: () => snStart(), onBtn2: () => go('menu'),
  });
}
function snStart() {
  const c = $('#snakeC');
  // поле під щільність екрана — щоб не було розмитим на телефоні
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const css = Math.round(c.getBoundingClientRect().width) || 360;
  SN.cell = Math.max(10, Math.floor(css * dpr / SN.n));
  c.width = c.height = SN.cell * SN.n;
  SN.body = [[5, 6], [4, 6], [3, 6]];
  SN.dir = [1, 0]; SN.next = [1, 0]; SN.score = 0; SN.over = false;
  $('#snScore').textContent = '0';
  $('#snAsk').textContent = 'Збирай яблучка 🍎';
  snFoodNew(); snDraw();
  clearInterval(SN.timer);
  SN.timer = setInterval(snStep, 320);   // повільно - для малят
}
START.snake = () => snStart();
STOP.snake = () => clearInterval(SN.timer);
function snTurn(d) {
  const m = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] }[d];
  if (!m || SN.over) return;
  if (m[0] === -SN.dir[0] && m[1] === -SN.dir[1]) return;  // назад не можна
  SN.next = m; blip();
}
$('.dpad').onclick = (e) => { const b = e.target.closest('[data-d]'); if (b) snTurn(b.dataset.d); };
document.addEventListener('keydown', (e) => {
  const k = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r' }[e.key];
  if (k && SCR === 'snake') { e.preventDefault(); snTurn(k); }
});
(() => {   // керування свайпом по полю
  const c = $('#snakeC'); let sx = 0, sy = 0;
  c.addEventListener('touchstart', (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  c.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    snTurn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
  }, { passive: true });
})();

/* ================================================================
   НАЛІПКИ
   ================================================================ */
START.album = () => {
  const left = (NEED - (S.stars % NEED)) % NEED || NEED;
  $('#albAsk').innerHTML = `Зібрано ${S.got.length} з ${STICKERS.length}<small>ще ${left} ⭐ до наступної</small>`;
  $('#album').innerHTML = STICKERS.map((s) => {
    const got = S.got.includes(s);
    return `<div class="sticker${got ? ' got' : ''}">${got ? s : '<span class="q">❓</span>'}</div>`;
  }).join('');
};

/* ================================================================
   БАТЬКІВСЬКИЙ КУТОЧОК: довге натискання на заголовок
   ================================================================ */
(() => {
  let t = null;
  const start = () => { t = setTimeout(parentGate, 1500); };
  const stop = () => clearTimeout(t);
  const h = $('#title');
  h.addEventListener('touchstart', start, { passive: true });
  h.addEventListener('mousedown', start);
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach((e) => h.addEventListener(e, stop));
})();
function parentGate() {
  const a = 3 + rnd(6), b = 4 + rnd(6);
  dialog({
    em: '🔒', h: 'Для батьків',
    p: `Щоб відкрити налаштування, порахуй: <b>${a} + ${b}</b>`,
    btn: 'Готово', btn2: 'Вийти',
    onBtn: () => { /* замінено нижче */ },
  });
  const box = $('#ovBox');
  box.querySelector('p').insertAdjacentHTML('afterend', '<div><input class="inp" id="gate" inputmode="numeric" autocomplete="off"></div>');
  $('#ovOk').onclick = () => {
    if (+$('#gate').value === a + b) { closeDialog(); parentPanel(); }
    else { $('#gate').value = ''; toast('Не те число'); }
  };
  setTimeout(() => $('#gate').focus(), 60);
}
function parentPanel() {
  const noVoice = VOICE_READY && !UA_VOICE;
  const hint = noVoice
    ? `<br><br>Щоб гра заговорила українською, треба додати український голос:<br>
       <b>Android:</b> Налаштування → Мови та введення → Синтез мови → Google → Мова → Українська (завантажити).<br>
       <b>iPhone:</b> Налаштування → Доступність → Вимовляння → Голоси → Українська.<br>
       Без нього гра просто мовчить — усі завдання є на екрані.`
    : '';
  dialog({
    em: '⚙️', h: 'Налаштування',
    p: `Звуки: <b>${S.sound ? 'увімкнено' : 'вимкнено'}</b> · Озвучка: <b>${S.voice ? 'увімкнено' : 'вимкнено'}</b><br>
        Голос: <b>${voiceInfo()}</b><br>
        Зірочок: <b>${S.stars}</b> · Наліпок: <b>${S.got.length}</b><br>Версія ${APP_VERSION}${hint}`,
    btn: 'Закрити', btn2: 'Змінити',
    onBtn2: () => {
      dialog({
        em: '⚙️', h: 'Що змінити?',
        btn: S.sound ? '🔇 Вимкнути звуки' : '🔊 Увімкнути звуки',
        btn2: S.voice ? '🤐 Вимкнути голос' : '🗣️ Увімкнути голос',
        onBtn: () => { S.sound = !S.sound; LS.set('sound', S.sound); toast(S.sound ? 'Звуки увімкнено' : 'Звуки вимкнено'); },
        onBtn2: () => { S.voice = !S.voice; LS.set('voice', S.voice); toast(S.voice ? 'Голос увімкнено' : 'Голос вимкнено'); },
      });
    },
  });
}

/* ---------- старт ---------- */
$('#starN').textContent = S.stars;
$('#back').style.visibility = 'hidden';
document.addEventListener('click', () => { ac(); loadVoices(); }, { once: true });
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
